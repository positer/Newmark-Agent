name: release-platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'dev-[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: DESKTOP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DESKTOP/package-lock.json
      - run: npm ci
      - name: Verify bound release version
        run: npm run release:version-check
      - name: Build Windows MSI and portable package
        env:
          # Hosted Windows runners do not include the OpenSSH server assets
          # required by the loopback SSH TUI stress. The default local release
          # path still runs that smoke; CI keeps the remaining package smokes.
          NEWMARK_SKIP_PACKAGED_SSH_TUI_STRESS: '1'
        run: npm run build:clean && node scripts/dist-portable.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: newmark-agent-windows
          if-no-files-found: error
          path: |
            release/Newmark-Agent-*-x64.msi
            release/Newmark-Agent-*-win-unpacked-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DESKTOP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DESKTOP/package-lock.json
      - run: npm ci
      - name: Verify bound release version
        run: npm run release:version-check
      - run: npm run build:clean
      - name: Build Linux AppImage, deb, and unpacked directory
        run: npx electron-builder --linux AppImage deb dir --publish never
      - name: Smoke-test and package Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          binary="../release/linux-unpacked/Newmark Agent"
          test -x "$binary"
          "$binary" --no-sandbox --help > /tmp/newmark-linux-help.txt
          grep -q -- '--root' /tmp/newmark-linux-help.txt
          grep -q -- 'install-update' /tmp/newmark-linux-help.txt
          version="$(cat ../VERSION)"
          cd ../release
          zip -qr "Newmark-Agent-${version}-linux-unpacked-x64.zip" linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: newmark-agent-linux
          if-no-files-found: error
          path: |
            release/Newmark-Agent-*.AppImage
            release/Newmark-Agent-*.deb
            release/Newmark-Agent-*-linux-unpacked-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DESKTOP/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
        working-directory: DESKTOP
      - name: Verify bound release version
        run: npm run release:version-check
        working-directory: DESKTOP
      - run: chmod +x android/gradlew
      - name: Test, lint, and build Android APK
        run: ./android/gradlew -p android testDebugUnitTest lintVitalRelease assembleRelease
      - name: Name Android release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Newmark-Agent-$(cat VERSION)-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: newmark-agent-android
          if-no-files-found: error
          path: release/Newmark-Agent-*-android.apk

  publish-release:
    if: startsWith(github.ref, 'refs/tags/dev-')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: newmark-agent-*
          merge-multiple: true
          path: release-assets
      - name: Publish six bound platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; preserving its verified assets."
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --prerelease --title "Newmark Agent $GITHUB_REF_NAME" --generate-notes
          fi
